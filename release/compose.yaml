name: miracle-local
x-app-image: &app-image ghcr.io/__REPOSITORY__:__VERSION__
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: miracle
      POSTGRES_DB: miracle
      POSTGRES_PASSWORD_FILE: /run/miracle/database_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - secrets:/run/miracle:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U miracle -d miracle"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  app:
    image: *app-image
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIRACLE_VERSION: __VERSION__
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: miracle
      DATABASE_USER: miracle
      DATABASE_PASSWORD_FILE: /run/miracle/database_password
      ENCRYPTION_KEY_FILE: /run/miracle/encryption_key
      APP_ORIGIN: http://localhost:${MIRACLE_PORT:-3001}
      COOKIE_SECURE: "false"
      HOST: 0.0.0.0
      PORT: "3001"
    volumes:
      - secrets:/run/miracle:ro
    ports:
      - "127.0.0.1:${MIRACLE_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    restart: unless-stopped
  maintenance:
    image: *app-image
    profiles: [maintenance]
    user: "0:0"
    entrypoint: [node, /app/scripts/local-state.mjs]
    environment:
      MIRACLE_VERSION: __VERSION__
      DATABASE_HOST: postgres
    volumes:
      - postgres-data:/pgdata
      - secrets:/secrets
volumes:
  postgres-data:
  secrets:
