name: Ошибка
description: Воспроизводимая проблема в Miracle
body:
  - type: markdown
    attributes:
      value: 'Не добавляйте пароли, токены, ключи, приватные SQL или данные. Уязвимости отправляйте через [приватный отчёт](https://github.com/Manannikov-Nikita/miracle/security/advisories/new).'
  - type: input
    id: version
    attributes:
      label: Версия Miracle
      placeholder: '0.1.0 или commit SHA'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: ОС и архитектура, версия Docker, браузер, установка из ZIP или исходников, ClickHouse или Trino.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Шаги воспроизведения
      description: Действия по порядку. Для SQL используйте минимальный пример с синтетическими данными.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Текст ошибки, очищенные от секретов логи или снимок экрана с синтетическими данными.
    validations:
      required: true
