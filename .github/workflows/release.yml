name: Publish version
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Validate fixed version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          node -e 'const p=require("./package.json"),l=require("./package-lock.json"),v=process.env.VERSION.slice(1);if(!/^\d+\.\d+\.\d+$/.test(v)||[p.version,l.version,l.packages[""].version].some(x=>x!==v))throw Error("Release tag must match manifests")'
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: .local/releases
          merge-multiple: true
      - name: Require five verified native artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win-x64; do
            test -s ".local/releases/miracle-$version-$target.tar.gz"
            (cd .local/releases && sha256sum -c "miracle-$version-$target.tar.gz.sha256")
          done
          test -s .local/releases/install.sh
          test -s .local/releases/install.ps1
      - name: Publish native archives and fixed-version installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs "$GITHUB_REF_NAME" .local/releases
