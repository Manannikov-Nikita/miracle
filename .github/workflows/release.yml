name: Publish version
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Validate fixed version and derive image name
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          VERSION="$version" node -e 'const p=require("./package.json"), l=require("./package-lock.json"); if ([p.version,l.version,l.packages[""].version].some(v => v !== process.env.VERSION)) throw new Error("Release tag must match package.json and package-lock.json")'
          repository="${GITHUB_REPOSITORY,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$repository:$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.version.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Require anonymous image access before releasing the installer
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          anonymous_config=$(mktemp -d)
          if ! docker --config "$anonymous_config" pull --platform linux/amd64 "$IMAGE"; then
            echo 'The GHCR package must be public. Set its visibility to Public, then rerun this job. No installer was published.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build installer archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/build-release.mjs "$GITHUB_REPOSITORY" "$VERSION"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ".local/releases/miracle-$VERSION.zip" ".local/releases/miracle-$VERSION.zip.sha256" --clobber
          else
            notes=".github/release-notes/$VERSION.md"
            if [ -f "$notes" ]; then
              gh release create "$GITHUB_REF_NAME" --verify-tag --title "Miracle $VERSION" --notes-file "$notes" ".local/releases/miracle-$VERSION.zip" ".local/releases/miracle-$VERSION.zip.sha256"
            else
              gh release create "$GITHUB_REF_NAME" --verify-tag --title "Miracle $VERSION" --generate-notes ".local/releases/miracle-$VERSION.zip" ".local/releases/miracle-$VERSION.zip.sha256"
            fi
          fi
