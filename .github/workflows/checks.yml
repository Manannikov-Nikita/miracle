name: Checks
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      connectors:
        description: Run optional real ClickHouse and Trino integrations
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    name: Native test and archive / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-26
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: npm ci
      - run: npm run notices
      - run: git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - run: npm test
      - run: npm run build
      - name: Build native archive with verified upstream runtime
        shell: bash
        run: node scripts/build-release.mjs "$GITHUB_REPOSITORY" "$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')" .local/releases "${{ matrix.target }}"
      - name: Installed bundled-runtime lifecycle, backup and restore
        shell: bash
        run: node tests/local-install-smoke.mjs ".local/releases/miracle-$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')-${{ matrix.target }}.tar.gz"
      - name: Update published 0.8.0 installation through miracle update
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          previous="0.8.0"
          directory=".local/update-source/$previous"
          mkdir -p "$directory"
          base="https://github.com/Manannikov-Nikita/miracle/releases/download/v$previous"
          asset="miracle-$previous-$TARGET.tar.gz"
          curl -fL --retry 3 "$base/$asset" -o "$directory/$asset"
          curl -fL --retry 3 "$base/$asset.sha256" -o "$directory/$asset.sha256"
          curl -fL --retry 3 "$base/install.sh" -o "$directory/install.sh"
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          node tests/upgrade-smoke.mjs ".local/releases/miracle-$version-$TARGET.tar.gz" "$directory/$asset"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: |
            .local/releases/*.tar.gz
            .local/releases/*.sha256
            .local/releases/install.sh
  connectors:
    if: github.event_name == 'workflow_dispatch' && inputs.connectors
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - run: docker compose --profile test up -d --wait clickhouse trino
      - run: npm run test:integration
      - run: npx tsx tests/clickhouse-tls-integration.ts
      - if: failure()
        run: docker compose --profile test logs --tail 100
      - if: always()
        run: docker compose --profile test down --volumes
